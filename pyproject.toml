[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-release-cli"
version = "1.0.0"
description = "CLI for upcoming anime releases, episode schedules, and airing information."
requires-python = ">=3.10"
dependencies = [
    "requests"
]

[project.scripts]
ani = "main:main"

[tool.setuptools]
py-modules = ["main", "api", "formatters", "models"]

[tool.setuptools.package-dir]
"" = "src"